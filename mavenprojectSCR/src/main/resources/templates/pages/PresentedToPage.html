<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>(1 of 19) Presented To</title>
<meta name="description" content="">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="all,follow">
<!-- Bootstrap CSS-->
 <th:block th:insert="fragments/header :: headerBlock"></th:block>


<link rel="shortcut icon" href="./img/tools_wizard.png">

</head>
<body>


	<!-- Begin page content -->
	<!--- start header container -->

	 <div th:replace="fragments/navForPages :: navForPages"></div>

	<div class="container" style="padding-top: 1%;">

		<div>
			<form method="post" action="savePresentedToPage" autocomplete="off">
				<fieldset>
					<legend>
						(1 of 19) Presented To - <span th:text="${wizard.name}"></span>
					</legend>
					<div class="form-group">
						<label for="presentedTo">Presentation To</label> <input
							th:value="${dataPageModel?.clientContactName}" type="text"
							onClick="this.setSelectionRange(0, this.value.length)"
							class="form-control" id="clientContactName"
							name="clientContactName" maxlength="35"
							aria-describedby="clientBusinessName" />
					</div>
					<div class="form-group">
						<label for="clientBusinessName">Business Name</label> <input
							type="text"
							onClick="this.setSelectionRange(0, this.value.length)"
							th:value="${dataPageModel?.clientBusinessName}"
							class="form-control" id="clientBusinessName" maxlength="35"
							name="clientBusinessName" />
					</div>
					<div class="form-group">
						<label for="presentedById">Integrated Media Specialist
							Name</label> <input type="text"
							onClick="this.setSelectionRange(0, this.value.length)"
							maxlength="35" th:value="${dataPageModel?.portfolioManagerName}"
							class="form-control" id="portfolioManagerName"
							name="portfolioManagerName" />
					</div>
					<div class="form-group">
						<label for=portfolioPhoneNumber>Phone Number</label> <input
							type="text"
							onClick="this.setSelectionRange(0, this.value.length)"
							th:value="${dataPageModel?.portfolioPhoneNumber}" required
							class="form-control input-medium bfh-phone"
							data-format="+1 (ddd) ddd-dddd" id="portfolioPhoneNumber"
							name="portfolioPhoneNumber" />
					</div>
					<div class="form-group">
						<label for=portfolioPhoneNumber>Station/Media Group</label> <input
							type="text"
							onClick="this.setSelectionRange(0, this.value.length)"
							th:value="${dataPageModel?.station}" maxlength="35"
							class="form-control" id="station" name="station" />
					</div>

					<div
						class="form-group custom-control custom-switch custom-switch-md">
						<input name="excluded" id="excluded"
							th:checked="${wizardData?.excluded}" type="checkbox"
							class="custom-control-input"> <label for="excluded"
							class="custom-control-label">Exclude from presentation</label>
					</div>



					<input type="hidden" id="nextPage"
						th:value="'redirect:/TeamCommitmentPage?ID=' + ${wizard.encrypt}"
						name="nextPage" /> <input type="hidden" id="publishNextPage"
						th:value="'redirect:/Publish?ID=' + ${wizard.encrypt}"
						name="publishNextPage" /> <input type="hidden" id="wizardId"
						th:value="${wizard.encrypt}" name="wizardId" /> <input
						type="hidden" id="wizarddataid"
						th:value="${wizardData?.wizarddataid}" name="wizarddataid" /> <input
						name="next" value="Next" type="submit" class="btn btn-primary"
						style="background-color: #C0B879;" /> <input name="publish"
						value="Publish" type="submit" class="btn btn-primary"
						style="background-color: #C0B879;" />







				</fieldset>
			</form>
                    
                    
                    <<div th:replace="fragments/wizardcopyright :: wizardcopyright"></div>
                        
                    </div>
			<div class="container" style="padding-top: 2%;">

				<div class="progress">
					<div class="progress-bar" role="progressbar" aria-valuenow="5"
						aria-valuemin="0" aria-valuemax="100"
						style="width: 5%; background-color: #C0B879;">5%</div>
				</div>
			</div>
			

		</div>

	</div>




	
	

</body>
</html>
